services:
  # Simulateur de données d'entrée
  acq-indus-py-input-simulator:
    build: ./py-input-tunnel-fan-simulator
    container_name: acq-indus-py-input-simulator
    depends_on:
      - acq-indus-mosquitto
    environment:
      - MQTT_BROKER=acq-indus-mosquitto
      - FAN_ID=TUNNEL_NORD_01
    restart: always
 
  # Le Broker MQTT (Le facteur qui distribue les messages)
  acq-indus-mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: acq-indus-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # La base de données (Optimisée pour le temps)
  acq-indus-influxdb:
    image: influxdb:2.7
    container_name: acq-indus-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=bg_soft
      - DOCKER_INFLUXDB_INIT_BUCKET=fan_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
      
  # Le pont entre MQTT et InfluxDB
  acq-indus-telegraf:
    image: telegraf:1.28
    container_name: acq-indus-telegraf
    depends_on:
      - acq-indus-mosquitto
      - acq-indus-influxdb
    environment:
      - INFLUX_URL=http://acq-indus-influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=bg_soft
      - INFLUX_BUCKET=fan_telemetry
      - MQTT_BROKER=acq-indus-mosquitto
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: always

  # API IA qui analyse les données à la recherche d'anomalies (isolation forest)
  acq-indus-py-ia-brain-api:
    build: ./py-ia-brain-api
    container_name: acq-indus-py-ia-brain-api
    environment:
      - INFLUXDB_TOKEN=${INFLUX_TOKEN}
      - INFLUXDB_ORG=bg_soft
      - INFLUXDB_BUCKET=fan_telemetry
      - INFLUXDB_URL=http://acq-indus-influxdb:8086
      - AI_API_FILTER_ADDR="0.0.0.0"
      - AI_API_PORT=8000
    depends_on:
      - acq-indus-influxdb
    ports:
      - "8000:8000"
    restart: always

  # Frontend supervision application
  acq-indus-frontend-supervision:
    build: ./frontend/acq-indus-frontend
    container_name: acq-indus-frontend-supervision
    ports:
      - "8081:80" # Accessible sur http://localhost:8081
    depends_on:
      - acq-indus-py-ia-brain-api # Attend que l'API soit prête
    restart: always
    
  # Visualisation avancée des données
  acq-indus-grafana:
    image: grafana/grafana:10.4.2
    container_name: acq-indus-grafana
    ports:
      - "3001:3000" # On utilise 3001 pour éviter tout conflit
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Mot de passe par défaut
      - GF_SECURITY_ALLOW_EMBEDDING=true
    depends_on:
      - acq-indus-influxdb
      - acq-indus-loki
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

  # ThingsBoard (plateforme IOT)
  acq-indus-thingsboard:
    image: thingsboard/tb-postgres:4.2.1
    container_name: acq-indus-thingsboard
    ports:
      - "9090:9090"
      - "1884:1883"
    environment:
      - TB_QUEUE_TYPE=in-memory
      - TB_INSTALL_DB=true  # On lui demande d'installer au démarrage (====> true uniquement au 1er démarrage)
      - JAVA_OPTS=-Xms1024M -Xmx2048M # On bride la RAM pour plus de fluidité
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard
    restart: always

  # Passerelle vers le service ThingsBoard
  acq-indus-thingsboard-gateway:
    image: thingsboard/tb-gateway:3.8.3
    container_name: acq-indus-thingsboard-gateway
    depends_on:
      - acq-indus-thingsboard
    environment:
      - TB_GW_HOST=acq-indus-thingsboard
      - TB_GW_PORT=1883
      - TB_GW_ACCESS_TOKEN=${THINGSBOARD_GATEWAY_TOKEN}
      - TB_GW_REMOTE_CONFIGURATION=false
    volumes:
      - ./thingsboard-gateway/config:/tb-gateway/config
      - thingsboard_gw_logs:/tb-gateway/logs
    restart: always

  # Le moteur de stockage des logs
  acq-indus-loki:
    image: grafana/loki:2.9.4
    container_name: acq-indus-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  # L'agent qui collecte les logs des conteneurs Docker
  acq-indus-promtail:
    image: grafana/promtail:2.9.4
    container_name: acq-indus-promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - acq-indus-loki
    restart: always

  # Web portal
  acq-indus-portal:
    build: ./frontend/acq-indus-portal
    container_name: acq-indus-portal
    ports:
      - "8080:80" # Accessible sur http://localhost:8080
    restart: always


volumes:
  influx_data:
  grafana_data:
  thingsboard_data:     # Pour persister la configuration et les alarmes de TB
  thingsboard_logs:
  thingsboard_gw_logs: