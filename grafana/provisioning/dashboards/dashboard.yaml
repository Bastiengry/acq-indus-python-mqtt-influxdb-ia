    folder: 'Industrial Monitoring'
    folderUid: 'industrial-monitoring-folder'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json_files/monitoring

  - name: 'POC Dashboards - Alarm Grafana'
    orgId: 1
    folder: 'Industrial Alarm (calculated from Grafana rules, not from IA Isolation Forest)'
