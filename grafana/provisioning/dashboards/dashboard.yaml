apiVersion: 1

providers:
  - name: 'POC Dashboards - Monitoring'
    orgId: 1
    folder: 'Industrial Monitoring'
    folderUid: 'industrial-monitoring-folder'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json_files/monitoring

  - name: 'POC Dashboards - Grafana Alert (Grafana Rules)'
    orgId: 1
    folder: 'Industrial Alert (calculated from Grafana rules, not from IA Isolation Forest)'
    folderUid: 'industrial-alert-folder'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json_files/alert

  - name: 'POC Dashboards - IA Estimations'
    orgId: 1
    folder: 'Industrial IA Estimations'
    folderUid: 'industrial-ia-estimation-folder'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json_files/ia-estimation